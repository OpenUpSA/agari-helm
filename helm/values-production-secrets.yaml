# Production secrets override file
# This file contains secure passwords for production deployment
# DO NOT commit this file to git

# Database passwords (for values-keycloak-db.yaml and values-song-db.yaml)
postgresql:
  postgresqlPassword: "postgress-password"  # Same password for both keycloak-db

# Keycloak admin and database passwords (for values-keycloak.yaml)
keycloak:
  database:
    password: "keycloak-db-password"  # Should match postgresql.postgresqlPassword above
  admin:
    password: "keycloak-admin-password"

# MinIO credentials (for values-minio.yaml)
minio:
  accessKey: "minio-admin"
  secretKey: "minio-secret-password"

# Elasticsearch password (for values-elasticsearch.yaml)
auth:
  elasticPassword: "elasticsearch-password"